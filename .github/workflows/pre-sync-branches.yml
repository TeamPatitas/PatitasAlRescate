name: Sincronización Segura de Ramas

on:
  workflow_dispatch: # Se ejecuta manualmente desde GitHub

jobs:
  sync-branches:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para tener acceso a todas las ramas

      - name: Configurar usuario Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 1. Fusionar ramas a main (Omite si hay conflictos)
        run: |
          git checkout main
          
          # Usamos un bucle para respetar tu orden exacto
          for branch in dev-and dev-diego dev-eve dev-jacky; do
            echo "----------------------------------------"
            echo "Intentando fusionar $branch en main..."
          
            # Intenta fusionar, pero se detiene antes del commit final
            if git merge origin/$branch --no-commit --no-ff; then
              echo "✅ Sin conflictos. Confirmando fusión..."
              git commit -m "Auto-merge de $branch hacia main" || echo "La rama ya estaba al día."
            else
              echo "⚠️ CONFLICTO DETECTADO con $branch. Abortando esta fusión."
              git merge --abort
            fi
          done
          
          # Subimos todos los cambios exitosos a main
          git push origin main

      - name: 2. Sincronizar main hacia las ramas (Omite si hay conflictos)
        run: |
          for branch in dev-and dev-diego dev-eve dev-jacky; do
            echo "----------------------------------------"
            echo "Actualizando $branch con lo nuevo de main..."
          
            # Nos movemos a la rama del desarrollador
            git checkout $branch || git checkout -b $branch origin/$branch
          
            if git merge main --no-commit --no-ff; then
              echo "✅ Sin conflictos. Confirmando actualización..."
              git commit -m "Auto-merge de main hacia $branch" || echo "La rama ya estaba al día."
              git push origin $branch
            else
              echo "⚠️ CONFLICTO DETECTADO al actualizar $branch. Abortando."
              git merge --abort
            fi
          done