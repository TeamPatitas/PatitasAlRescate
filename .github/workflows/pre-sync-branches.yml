name: Sincronización Segura de Ramas

on:
  workflow_dispatch:

jobs:
  sync-branches:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write # Permiso vital para crear el Pull Request

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar usuario Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Creamos un archivo vacío para recordar qué ramas fallaron
          touch ramas_fallidas.txt

      - name: 1. Fusionar a master y Crear PR en conflictos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Necesario para usar el comando 'gh'
        run: |
          git checkout master
          
          for branch in dev-and dev-diego dev-eve dev-jacky; do
            echo "----------------------------------------"
            echo "Intentando fusionar $branch en master..."
          
            if git merge origin/$branch --no-commit --no-ff; then
              echo "✅ Sin conflictos. Confirmando fusión..."
              git commit -m "Auto-merge de $branch hacia master" || echo "La rama ya estaba al día."
            else
              echo "⚠️ CONFLICTO DETECTADO con $branch. Abortando esta fusión."
              git merge --abort
          
              # Anotamos la rama en nuestra "lista negra" temporal
              echo "$branch" >> ramas_fallidas.txt
          
              # Revisamos si ya existe un PR abierto para esta rama
              PR_EXISTS=$(gh pr list --head $branch --base master --json number --jq 'length')
          
              if [ "$PR_EXISTS" -eq "0" ]; then
                echo "Creando Pull Request para resolver el conflicto..."
                gh pr create \
                  --title "⚠️ Conflicto de Merge: $branch" \
                  --body "El bot detectó conflictos al intentar sincronizar \`$branch\` con \`master\`. Por favor, resuelve los conflictos en este Pull Request." \
                  --head $branch \
                  --base master
              else
                echo "Ya existe un PR abierto para $branch, omitiendo creación."
              fi
            fi
          done
          
          # Subimos todos los merges exitosos a master
          git push origin master

      - name: 2. Sincronizar master hacia las ramas (Solo exitosas)
        run: |
          for branch in dev-and dev-diego dev-eve dev-jacky; do
            echo "----------------------------------------"
          
            # Si la rama está en el archivo de fallas, la saltamos con 'continue'
            if grep -q "^${branch}$" ramas_fallidas.txt; then
              echo "⏭️ Saltando $branch porque tuvo conflictos en el paso anterior."
              continue
            fi
          
            echo "Actualizando $branch con lo nuevo de master..."
            git checkout $branch || git checkout -b $branch origin/$branch
          
            if git merge master --no-commit --no-ff; then
              echo "✅ Sin conflictos. Confirmando actualización..."
              git commit -m "Auto-merge de master hacia $branch" || echo "La rama ya estaba al día."
              git push origin $branch
            else
              echo "⚠️ CONFLICTO DETECTADO al actualizar $branch. Abortando."
              git merge --abort
            fi
          done